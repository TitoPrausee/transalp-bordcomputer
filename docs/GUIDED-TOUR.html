<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bordcomputer — Geführte Tour</title>
<style>
@property --p{syntax:'<integer>';inherits:true;initial-value:0}
:root{--bg:#000;--page:#0c0c0c;--card:#0f0f0f;--text:#fff;--muted:#8c8c8c;--line:#1d1d1d;--acc:#f0a020;--ok:#3ddc84;--bad:#e5322d;--font:"SF Pro Display",-apple-system,"Helvetica Neue","Inter",Arial,sans-serif;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--page);color:var(--text);font-family:var(--font);line-height:1.6}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}

/* Layout */
.shell{display:flex;min-height:100vh}
.sidebar{width:280px;min-width:280px;background:var(--bg);border-right:1px solid var(--line);padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.content{flex:1;padding:40px 60px;max-width:900px}

/* Sidebar */
.sidebar h2{font-size:14px;font-weight:300;color:var(--muted);letter-spacing:2px;padding:0 24px;margin-bottom:16px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 24px;font-size:14px;font-weight:300;color:var(--muted);cursor:pointer;transition:all .2s;border-left:3px solid transparent}
.nav-item:hover{color:var(--text);background:var(--card)}
.nav-item.active{color:var(--text);border-left-color:var(--acc);background:var(--card)}
.nav-item.done{color:var(--ok)}
.nav-num{width:28px;height:28px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.nav-item.active .nav-num{background:var(--acc);color:#000}
.nav-item.done .nav-num{background:var(--ok);color:#000}

/* Progress bar */
.progress{padding:0 24px 20px;border-bottom:1px solid var(--line);margin-bottom:16px}
.progress-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--acc);border-radius:2px;width:calc(var(--p)*1%)}
.progress-label{font-size:12px;color:var(--muted)}

/* Content sections */
section{display:none;animation:fadeIn .4s ease}
section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

h1{font-size:32px;font-weight:200;margin-bottom:8px}
h2{font-size:22px;font-weight:300;margin:32px 0 12px;color:var(--text)}
h3{font-size:16px;font-weight:500;margin:24px 0 8px;color:var(--muted);letter-spacing:1px}
p{font-weight:300;margin-bottom:16px;color:#d0d0d0}
ul{list-style:none;padding:0}
li{padding:6px 0;font-weight:300}
li::before{content:"→ ";color:var(--acc)}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin:16px 0}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin:16px 0}
.doc-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;transition:all .2s;cursor:pointer;text-decoration:none;display:block}
.doc-card:hover{border-color:var(--acc);transform:translateY(-2px)}
.doc-card h4{font-size:16px;font-weight:400;margin-bottom:6px;color:var(--text)}
.doc-card p{font-size:13px;color:var(--muted);margin:0}
.doc-card .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;background:var(--line);color:var(--ok);margin-top:8px}

/* Images */
.img-wrap{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin:16px 0}
.img-wrap img{width:100%;display:block}
.img-caption{font-size:12px;color:var(--muted);padding:8px 12px;background:var(--card)}

/* Navigation buttons */
.nav-btns{display:flex;justify-content:space-between;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.btn{padding:12px 24px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;cursor:pointer;transition:all .2s;font-family:var(--font)}
.btn:hover{border-color:var(--acc)}
.btn-primary{background:var(--acc);color:#000;border-color:var(--acc)}

/* Tables */
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);font-weight:500;font-size:12px;letter-spacing:1px;color:var(--muted)}
td{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:300}

/* Step indicator */
.step-indicator{display:flex;gap:4px;margin-bottom:24px}
.step-dot{width:24px;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.step-dot.done{background:var(--ok)}
.step-dot.active{background:var(--acc)}

/* Code */
code{background:var(--line);padding:2px 6px;border-radius:4px;font-size:13px;font-family:"SF Mono",monospace}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px;overflow-x:auto;font-size:13px;margin:16px 0}
pre code{background:none;padding:0}

/* Callout */
.callout{border-left:3px solid var(--acc);padding:12px 16px;background:var(--card);border-radius:0 8px 8px 0;margin:16px 0}
.callout-bad{border-left-color:var(--bad)}

@media(max-width:768px){
  .shell{flex-direction:column}
  .sidebar{position:relative;width:100%;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .content{padding:20px}
}
</style>
</head>
<body>
<div class="shell">

<!-- Sidebar -->
<nav class="sidebar">
<div class="progress">
<div class="progress-label">Fortschritt: <span id="pct">0</span>%</div>
<div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
</div>
<h2>GEFÜHRTE TOUR</h2>
<div id="nav-list"></div>
</nav>

<!-- Content -->
<main class="content" id="content">

<!-- Sections will be rendered here -->

</main>
</div>

// Render
const navList=document.getElementById('nav-list');
const content=document.getElementById('content');
let current=0;

steps.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='nav-item';
  el.innerHTML=`<span class="nav-num">${s.n}</span><span>${s.icon} ${s.title}</span>`;
  el.onclick=()=>goTo(i);
  navList.appendChild(el);
});

function goTo(idx){
  current=idx;
  // Nav
  document.querySelectorAll('.nav-item').forEach((el,i)=>{
    el.classList.toggle('active',i===idx);
    el.classList.toggle('done',i<idx);
  });
  // Content
  content.innerHTML=`
    <div class="step-indicator">${steps.map((s,i)=>`<div class="step-dot ${i<idx?'done':''} ${i===idx?'active':''}"></div>`).join('')}</div>
    ${steps[idx].body}
    <div class="nav-btns">
      ${idx>0?`<button class="btn" onclick="goTo(${idx-1})">← ${steps[idx-1].title}</button>`:'<div></div>'}
      ${idx<steps.length-1?`<button class="btn btn-primary" onclick="goTo(${idx+1})">${steps[idx+1].title} →</button>`:'<div></div>'}
    </div>
  `;
  // Progress
  const pct=Math.round((idx/(steps.length-1))*100);
  document.getElementById('pct').textContent=pct;
  document.getElementById('pfill').style.setProperty('--p',pct);
  window.scrollTo(0,0);
}

goTo(0);
</script>
