name: Semgrep SAST Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep Scan (C + TypeScript)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/c
            p/typescript
            p/owasp-top-ten
          generateSarifReport: "1"

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          # semgrep-action may produce SARIF with severity values that
          # GitHub's validator rejects (e.g. "MEDIUM"). The scan itself
          # succeeds — this upload is best-effort.
          sarif_file: semgrep.sarif

      - name: Upload Semgrep report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            *.sarif
          if-no-files-found: warn
          retention-days: 30
