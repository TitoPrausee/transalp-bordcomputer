name: Deploy Mockups to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['mockups/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload mockups as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mockups
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
