name: Companion-App CI

on:
  push:
    branches: [main]
    paths:
      - 'companion-app/**'
      - '.github/workflows/companion-app-ci.yml'
  pull_request:
    paths:
      - 'companion-app/**'
      - '.github/workflows/companion-app-ci.yml'

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-app
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: companion-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install ESLint
        run: npm install --save-dev eslint@^9.0.0

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings 0

  build:
    name: Build (Metro + APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-app
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: companion-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Metro Bundler build (blocking)
        run: |
          # Metro 0.87 requires Node 22+.
          # Use react-native bundle directly — @expo/cli's expo export
          # imports metro/src/lib/TerminalReporter which isn't exported
          # by metro 0.87 (Expo SDK 52 / @expo/cli version mismatch).
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file App.tsx \
            --bundle-output /tmp/app-bundle.js \
            --assets-dest /tmp/assets 2>&1
          echo "Metro build succeeded"

      - name: APK build (release)
        run: |
          if [ -n "$ANDROID_HOME" ] || [ -d "/usr/local/lib/android/sdk" ]; then
            echo "Building release APK..."
            cd android 2>/dev/null && ./gradlew assembleRelease || \
              echo "No native android/ directory — skipping APK build"
          else
            echo "Android SDK not available — Metro bundle is the build artifact"
          fi

      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          find . -name '*.apk' -exec cp {} artifacts/ \; 2>/dev/null || true

      - name: Upload app build
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: companion-app/artifacts/
          retention-days: 30

  test:
    name: Test (Jest + Coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-app
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: companion-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install test dependencies (jest, ts-jest, types)
        run: |
          npm install --save-dev jest@^29.7.0 ts-jest@^29.2.0 @types/jest@^29.5.0 || true

      - name: Run Jest unit tests with coverage
        run: |
          npx jest --ci --coverage --reporters=default 2>&1

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-coverage-report
          path: companion-app/coverage/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results
          path: companion-app/coverage/
          retention-days: 30
