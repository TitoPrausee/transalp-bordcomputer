name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild (JavaScript/TypeScript)
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/autobuild@v4

      - name: Build C/C++ for CodeQL analysis
        if: matrix.language == 'c-cpp'
        working-directory: firmware
        run: |
          # Compile firmware C sources so CodeQL can trace the code.
          # ESP-IDF is not available in CI, so we use GCC with mock headers.
          sudo apt-get install -y -qq build-essential gcc

          # Compile each .c file with -c (object output) so CodeQL sees real compilation.
          # The mock headers in test/mocks/ provide the ESP-IDF API surface.
          mkdir -p /tmp/codeql-objects
          find components -name '*.c' -print0 | while IFS= read -r -d '' f; do
            gcc -c \
              -Icomponents/*/include \
              -Imain \
              -Itest/mocks \
              -o /tmp/codeql-objects/$(basename "$f" .c).o \
              "$f" 2>&1 || echo "  (skipped: $f — ESP-IDF headers not fully available)"
          done

          # Also compile the test files — they exercise real firmware code paths
          find test -name 'test_*.c' -print0 | while IFS= read -r -d '' f; do
            gcc -c \
              -Icomponents/*/include \
              -Imain \
              -Itest/mocks \
              -o /tmp/codeql-objects/$(basename "$f" .c).o \
              "$f" 2>&1 || echo "  (skipped: $f)"
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
