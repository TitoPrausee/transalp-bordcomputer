name: Simulator CI

on:
  push:
    branches: [main]
    paths:
      - 'tools/simulator/**'
      - '.github/workflows/simulator-ci.yml'
  pull_request:
    paths:
      - 'tools/simulator/**'
      - '.github/workflows/simulator-ci.yml'
  workflow_dispatch:

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: Simulator Unit Tests (pytest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v9
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: tools/simulator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: tools/simulator
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: tools/simulator/tests/
          retention-days: 30

  simulated-ride:
    name: 24h Simulated Ride (Accelerated)
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v9
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: tools/simulator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run accelerated 24h simulated ride
        working-directory: tools/simulator
        run: |
          echo "=== 24h Simulated Ride (fast mode, 1Hz sampling) ==="
          # 24h = 86400s simulated time
          # --fast: no real-time sleep, --skip-display: no framebuffer per tick
          # 1Hz tick: one tick per second of simulated time = 86400 ticks total
          python3 simulator.py \
            --track tracks/sample_alps.gpx \
            --duration 86400 \
            --speed-multiplier 1000 \
            --tick-hz 1 \
            --ci-mode \
            --fast \
            --skip-display \
            --seed 42 \
            2>&1 | tee /tmp/simulated-ride.log

          echo ""
          echo "=== Ride Simulation Complete ==="

          # Verify the simulation ran
          if grep -q "Simulation Complete" /tmp/simulated-ride.log; then
            echo "SUCCESS: 24h simulated ride completed"
          else
            echo "WARNING: Simulation did not complete within timeout"
          fi

      - name: Upload ride log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulated-ride-log
          path: /tmp/simulated-ride.log
          retention-days: 30

  lint:
    name: Python Lint (pyflakes)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v9
        with:
          python-version: '3.12'

      - name: Install pyflakes
        run: pip install pyflakes

      - name: Run pyflakes
        working-directory: tools/simulator
        run: |
          # Lint all Python files, ignore import warnings for local modules
          python -m pyflakes *.py tests/*.py || true
          echo "Pyflakes check complete (warnings shown above, if any)"
