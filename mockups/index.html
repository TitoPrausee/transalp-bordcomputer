@keyframes lax{from{transform:scaleX(0)}}
@keyframes lup{from{transform:scaleY(0)}}

<script>
(function(){
var A0=132.5,SP=275,C=['#3ddc84','#8fe25f','#d6e04a','#f5c030','#f0a020','#ee7b27','#e8472d','#e5322d'];
function P(cx,cy,r,a){a=a*Math.PI/180;return (cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1)}
function arc(cx,cy,r,a,b){return 'M'+P(cx,cy,r,a)+'A'+r+' '+r+' 0 '+(b-a>180?1:0)+' 1 '+P(cx,cy,r,b)}
document.querySelectorAll('[data-ring]').forEach(function(g){
  var p=g.dataset.ring.split(','),cx=+p[0],cy=+p[1],r=+p[2],w=+p[3],h='';
  if(p[4]==='s'){var d=arc(cx,cy,r,A0,A0+SP);
    h='<path d="'+d+'" fill="none" stroke="#1d1d1d" stroke-width="'+w+'" stroke-linecap="round"/><path class="sp" d="'+d+'" pathLength="1" fill="none" stroke="#e6e6e6" stroke-width="'+w+'" stroke-linecap="round"/>';
  }else{
    h='<path d="'+arc(cx,cy,r,A0,A0+SP)+'" fill="none" stroke="#161616" stroke-width="'+w+'"/>';
    for(var i=0;i<8;i++)h+='<path class="seg" style="--a:'+i/8+'" d="'+arc(cx,cy,r,A0+SP*i/8,A0+SP*(i+1)/8)+'" pathLength="1" fill="none" stroke="'+C[i]+'" stroke-width="'+w+'"/>';
  }
  g.innerHTML=h;
});
var b='';for(var i=0;i<28;i++){var v=Math.round(45+28*Math.sin(i/4.2)+14*Math.sin(i*1.9));b+='<i style="--h:'+v+';--i:'+i+'"></i>'}
document.getElementById('bars').innerHTML=b;
var bs=document.getElementById('boot');setInterval(function(){bs.classList.remove('go');void bs.getBoundingClientRect();bs.classList.add('go')},8000);
function fit(){document.querySelectorAll('.fr').forEach(function(f){f.firstElementChild.style.transform='scale('+f.clientWidth/480+')'})}
addEventListener('resize',fit);fit();
})();
</script>
