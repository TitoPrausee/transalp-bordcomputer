<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warning-Screen</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
</head>
<body>
<div class="mockup-frame">
  <div class="page-label">Warning-Screen (480x320 TFT)</div>
  <div class="display-tft" id="warn-screen" style="position:relative;">

    <!-- Warnung: Oeldruck -->
    <div class="warning-overlay" id="warning-overlay">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="warning-icon">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <div class="warning-text">OELDRUCK</div>
      <div class="warning-subtext">Kritischer Oeldruck erkannt</div>
      <div class="warning-subtext" style="color:var(--accent-red); font-size:20px; font-weight:700;">0.2 bar</div>
      <button class="btn btn-danger" id="ack-btn" style="margin-top:12px;">Quittieren</button>
    </div>

  </div>

  <!-- Warnung-Auswahl -->
  <div style="display:flex; gap:8px; margin-top:12px;">
    <button class="btn btn-danger" onclick="showWarning('oel')">Oeldruck</button>
    <button class="btn btn-danger" onclick="showWarning('temp')">Temperatur</button>
    <button class="btn btn-danger" onclick="showWarning('volt')">Bordspannung</button>
  </div>
</div>

<script>
const warnings = {
  oel: {
    icon: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    title: 'OELDRUCK',
    sub: 'Kritischer Oeldruck erkannt',
    value: '0.2 bar',
  },
  temp: {
    icon: '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/><line x1="12" y1="9" x2="12" y2="13"/>',
    title: 'KUEHLMITTELTEMP',
    sub: 'Uebertemperatur Kuehlmittel',
    value: '118 C',
  },
  volt: {
    icon: '<rect x="2" y="7" width="16" height="10" rx="1"/><line x1="22" y1="11" x2="22" y2="13"/><path d="M13 10l-3 4h2l-1 3"/>',
    title: 'BORDSPANNUNG',
    sub: 'Spannung ausserhalb Toleranz',
    value: '11.2V',
  },
};

function showWarning(type) {
  const w = warnings[type];
  const overlay = document.getElementById('warning-overlay');

  overlay.innerHTML =
    '<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="warning-icon">' + w.icon + '</svg>' +
    '<div class="warning-text">' + w.title + '</div>' +
    '<div class="warning-subtext">' + w.sub + '</div>' +
    '<div class="warning-subtext" style="color:var(--accent-red); font-size:20px; font-weight:700;">' + w.value + '</div>' +
    '<button class="btn btn-danger" id="ack-btn" style="margin-top:12px;">Quittieren</button>';

  overlay.style.animation = 'none';
  void overlay.offsetWidth;
  overlay.style.animation = 'fade-in 150ms var(--ease-out)';

  bindAck();
}

function bindAck() {
  const btn = document.getElementById('ack-btn');
  if (btn) {
    btn.addEventListener('click', function() {
      const overlay = document.getElementById('warning-overlay');
      overlay.style.animation = 'fade-out 120ms var(--ease-in) forwards';
      setTimeout(() => {
        overlay.innerHTML = '<div style="font-size:14px; color:var(--fg-secondary);">Keine aktiven Warnungen</div>';
        overlay.style.animation = 'fade-in 150ms var(--ease-out)';
      }, 120);
    });
  }
}

bindAck();
</script>
</body>
</html>
