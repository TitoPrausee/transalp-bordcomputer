<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tour-Statistik-Screen</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
</head>
<body>
<div class="mockup-frame">
  <div class="page-label">Tour-Statistik-Screen (480x320 TFT)</div>
  <div class="display-tft" id="tour-screen">

    <!-- Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 12px; border-bottom:1px solid var(--bg-panel);">
      <span style="font-size:24px; font-weight:700;">TOUR-STATISTIK</span>
      <span style="font-size:12px; color:var(--fg-secondary);">13.10.2026</span>
    </div>

    <!-- Hero-Bereich: Distanz + Dauer -->
    <div style="display:flex; justify-content:space-around; align-items:center; padding:12px 0 8px;">
      <div style="text-align:center; animation: count-up-fade 800ms var(--ease-out) both;">
        <div class="count-up" id="dist-val">0</div>
        <div class="stat-label">Distanz (km)</div>
      </div>
      <div style="width:1px; height:40px; background:var(--bg-panel);"></div>
      <div style="text-align:center; animation: count-up-fade 800ms var(--ease-out) 100ms both;">
        <div class="count-up" id="dur-val">0h 0min</div>
        <div class="stat-label">Dauer</div>
      </div>
    </div>

    <!-- Sekundaer-Statistiken -->
    <div style="display:flex; flex-direction:column; gap:2px; padding:0 12px; animation: count-up-fade 800ms var(--ease-out) 300ms both;">
      <div style="display:flex; justify-content:space-between; font-size:14px;">
        <span style="color:var(--fg-secondary);">Durchschnitt</span>
        <span style="font-weight:600;">68 km/h</span>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:14px;">
        <span style="color:var(--fg-secondary);">Max-Speed</span>
        <span style="font-weight:600;">128 km/h</span>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:14px;">
        <span style="color:var(--fg-secondary);">Max-RPM</span>
        <span style="font-weight:600;">7800</span>
      </div>
    </div>

    <!-- Hoehen-Profil -->
    <div style="padding:8px 12px; animation: count-up-fade 800ms var(--ease-out) 500ms both;">
      <div style="font-size:10px; color:var(--fg-secondary); text-transform:uppercase; margin-bottom:4px;">Hoehe</div>
      <div class="height-chart" id="height-chart">
      </div>
      <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--fg-secondary); margin-top:2px;">
        <span>Start 412m</span>
        <span>Max 1247m</span>
        <span style="color:var(--accent-green);">+950m</span>
        <span style="color:var(--accent-red);">-820m</span>
      </div>
    </div>

    <!-- Verbrauch -->
    <div style="display:flex; justify-content:space-between; padding:4px 12px; font-size:12px; animation: count-up-fade 800ms var(--ease-out) 600ms both;">
      <span style="color:var(--fg-secondary);">Verbrauch</span>
      <span>ca. 5.2 L (34 km/L)</span>
    </div>

    <!-- Buttons -->
    <div style="position:absolute; bottom:8px; left:0; right:0; display:flex; justify-content:center; gap:12px;">
      <button class="btn btn-primary">GPX exportieren</button>
      <button class="btn">Statistik teilen</button>
    </div>

  </div>
</div>

<script>
// Count-Up Animation fuer Distanz
(function() {
  const distEl = document.getElementById('dist-val');
  const durEl = document.getElementById('dur-val');
  const targetDist = 142;
  const targetHours = 3, targetMins = 24;
  const duration = 800;
  const start = performance.now();

  function animate(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    distEl.textContent = Math.round(targetDist * eased);
    const h = Math.round(targetHours * eased);
    const m = Math.round(targetMins * eased);
    durEl.textContent = h + 'h ' + m + 'min';
    if (t < 1) requestAnimationFrame(animate);
  }
  setTimeout(() => requestAnimationFrame(animate), 200);
})();

// Height Chart Balken (gestaffelt)
(function() {
  const heights = [20, 35, 50, 58, 45, 30, 42, 28];
  const chart = document.getElementById('height-chart');
  heights.forEach((h, i) => {
    const bar = document.createElement('div');
    bar.className = 'height-bar';
    bar.style.height = '0px';
    bar.style.transition = 'height 300ms var(--ease-out)';
    bar.style.transitionDelay = (i * 100 + 700) + 'ms';
    chart.appendChild(bar);
    setTimeout(() => { bar.style.height = h + 'px'; }, 50);
  });
})();
</script>
</body>
</html>
